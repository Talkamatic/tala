[build-system]
requires = ["setuptools>=68.2.2", "setuptools-scm>=8.0.4", "wheel"]
build-backend = "setuptools.build_meta"

[project]

dynamic = ["version"]
name = "tala"
description = "Python library and developer toolkit for the TDM dialogue platform"
readme = "README.md"
authors = [
    { name = "Talkamatic", email = "dev@talkamatic.se" }
]
keywords = ["tala", "tdm", "ddd", "ddds", "dialogue", "conversation", "AI"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    "azure-data-tables==12.5.0",
    "azure-identity>=1.16.0",
    "azure-monitor-ingestion>=1.0.0",
    "iso8601>=0.1.14",
    "Jinja2>=3.0.1, <4",
    "lxml>=4.6.3",
    "paho-mqtt==2.1.0",
    "prompt-toolkit>=3.0.19",
    "requests>=2.26.0",
    "structlog>=21.1.0",
    "websocket-client>=1.8.0"
]


[project.urls]
Homepage = "https://www.talkamatic.se"
Documentation = "https://docs.talkamatic.se"
Repository = "https://github.com/ordstrom-ai/tala"

[project.scripts]
tala-interact = "tala.cli.interact.console:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["tala", "tala.*"]
exclude = ["*.test", "*.test.*"]
namespaces = true

[tool.setuptools.package-data]
tala = [
    "ddd/maker/templates/*.txt",
    "ddd/maker/templates/*.xml",
    "ddd/schemas/ontology.xsd",
    "ddd/schemas/service_interface.xsd",
    "ddd/schemas/domain.xsd",
    "ddd/schemas/json/*.json",
    "ddd/schemas/xs3p/xs3p.xsl",
    "ddd/schemas/xs3p/LICENSE.html",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-timestamp"
