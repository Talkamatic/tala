name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install development and package dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --editable .
      - name: Build wheel and source distribution
        run: python -m build --outdir "$RUNNER_TEMP/tala-dist"
      - name: Run Jenkins test profile
        run: python -m pytest tala
      - name: Run Jenkins lint profile
        run: |
          python -m pylint tala
          python -m flake8 . --exclude ddds/,.eggs/
